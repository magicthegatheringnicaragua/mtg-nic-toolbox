name: Deploy calendar-generator to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "apps/calendar-generator/**"
      - ".github/workflows/deploy-calendar-generator.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run grid unit tests
        run: node --test apps/calendar-generator/src/grid.test.mjs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/calendar-generator

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
