          - "canvas.toDataURL/toBlob throws or yields a blank/tainted image even when served over local http(s) (not file://)"
          - "Verification (grid unit test or manual export demo) fails twice after a fix attempt"
          - "Reference layout requires an element unachievable with placeholder assets/plain canvas text (e.g. a licensing-gated font) without silently substituting"
      evidence:
