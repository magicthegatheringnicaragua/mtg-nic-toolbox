        - "docs/goals/calendar-generator/state.yaml (T001 receipt)"
        - "docs/goals/calendar-generator/notes/reference-calendar-layout.png (1600x1236px, confirmed unset Sabado cells show no date number, only background art)"
        - "repo listing: only .gitignore and docs/ exist at root; no apps/ yet"
