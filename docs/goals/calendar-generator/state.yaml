# GoalBuddy v2 state.yaml
# Board truth lives here. goal.md is the editable charter; notes/ holds long receipts only.

version: 2

goal:
  title: "Calendar Generator (mtg-nic-toolbox)"
  slug: "calendar-generator"
  kind: specific # specific | open_ended | existing_plan | recovery | audit
  tranche: "Tranche 7 (design-polish backlog): swap the title/header display font from Mike Hind's 1998 lookalike to the REAL Beleren2016-Bold typeface, sourced from https://github.com/Saeris/typeface-beleren-bold (the actual font extracted from Wizards' own website, confirmed via embedded TTF metadata: 'Copyright (c) 2014-2016 Wizards of the Coast, a Hasbro Subsidiary. All rights reserved.'). This is the authentic typeface used in the current/modern Magic branding (unlike Mike Hind's font, which recreates the old pre-2015 logo and didn't visually match). User was again informed this font is Wizards' proprietary copyright with no official redistribution license - the GitHub repo's own README states 'This is not an official or authorized library! ... published for non-commercial use' - and chose to proceed for this non-commercial community project, same risk category as the prior font. Unlike Mike Hind's font, Beleren2016-Bold has full Spanish glyph coverage (confirmed: Ñ, ñ, accented vowels, ¿, ¡) so it is NOT limited to accent-free strings, but keep it scoped to title/headers only for this tranche unless the user asks to expand its use."
  status: done # active | blocked | done
  oracle:
    signal: "Generate the October 2026 calendar, download the PNG, and visually confirm the title/headers now render in the real Beleren2016-Bold typeface (visually matching the actual logo's lettering style, not Mike Hind's lookalike), with no regression to tranches 1-6 (logo transparency, card art, background, grid/spillover, 2000px width)."
    cadence: "after each Worker package and at final audit"
    final_proof: "Unit test still passes, a visual demo confirms the swap, and LICENSE-NOTICE.md is updated to accurately credit Wizards of the Coast's 2014-2016 copyright on Beleren2016-Bold and its non-authorized/non-commercial sourcing via the Saeris GitHub repo."
  intake:
    original_request: "Build the first app of mtg-nic-toolbox: a tool for the MTG community in Nicaragua to generate monthly event calendars matching a reference poster layout, selecting a format (or custom event) per Fri/Sat/Sun day, each with its own repo-hosted image, plus a generic image for custom events."
    interpreted_outcome: "A static client-side web app, scaffolded as apps/calendar-generator/ in a monorepo, that lets the organizer pick a month, assign a format/custom label+image to each weekend day, and export a PNG poster matching the reference calendar layout."
    input_shape: specific
    audience: "Magic: The Gathering community (organizers/players) in Nicaragua"
    authority: requested
    proof_type: demo
    completion_proof: "Downloadable PNG for October 2026 visually matches docs/goals/calendar-generator/notes/reference-calendar-layout.png in structure, and the date-grid unit test passes."
    likely_misfire: "Building a generic 7-day calendar grid instead of the Fri/Sat/Sun-only poster structure, missing adjacent-month spillover days, missing the custom-event image path, or introducing a backend/framework beyond what this simple static tool needs."
    blind_spots_considered:
      - "Week rows are grouped by Fri/Sat/Sun only; a row can show a date from the adjacent month (e.g. Nov 1 appears in Oct 2026's last row)."
      - "Unset days render filler/background art, not blank/hidden cells."
      - "Catalog is one flat list (formats and event-types mixed, e.g. 'Store Championship'); per-day label text defaults to the selected entry's name but is freely editable so combined labels like 'Store Championship (Pauper)' are possible."
      - "Output resolution should be reasonable for social media sharing, matching the reference image's rough aspect ratio."
    existing_plan_facts: []

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  exact_human_approval_can_terminal_wait: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  # installed | bundled_not_installed | missing | unknown
  # missing and bundled_not_installed use PM fallback; unknown requires one exact-role attempt before fallback.
  scout: installed
  worker: installed
  judge: installed

visual_board:
  # none | local | unknown
  selected: local
  local:
    status: live # not_requested | starting | live | generated | blocked
    url: "http://goalbuddy.localhost:41737/calendar-generator/"
    command: "node <skill-path>/surfaces/local-goal-board/scripts/local-goal-board.mjs --goal docs/goals/calendar-generator"

active_task: null

tasks:
  - id: T001
    type: scout
    assignee: Scout
    status: done
    reasoning_hint: low
    objective: "Confirm the repo is empty of conflicting conventions, survey feasible client-side approaches for composing the poster image (Canvas API vs SVG, no backend/build step), and work out the exact week-grid algorithm needed to reproduce notes/reference-calendar-layout.png (rows = weeks restricted to Fri/Sat/Sun columns, adjacent-month spillover days, e.g. Nov 1 in Oct 2026's last row)."
    inputs:
      - "docs/goals/calendar-generator/goal.md"
      - "docs/goals/calendar-generator/notes/reference-calendar-layout.png"
      - "repo root (currently empty)"
    constraints:
      - "Read-only."
      - "Do not edit implementation files."
      - "Prefer concrete file-path evidence and a worked date-grid algorithm (with the Oct 2026 example traced through it) over generic advice."
    expected_output:
      - "Recommended composition approach (Canvas/SVG) with rationale"
      - "Worked week-grid algorithm, traced against October 2026"
      - "Any repo-structure or tooling considerations for apps/calendar-generator/"
      - "Candidate Worker task shape for T002/T003"
    receipt:
      result: done
      summary: "Repo has no apps/, package.json, or conflicting conventions. Recommend plain Canvas 2D (not SVG) for composition: drawImage for per-day art, fillText/strokeText for outlined bold labels, canvas.toDataURL/toBlob for one-call PNG export, zero build step. Worked week-grid algorithm traced exactly against Oct 2026 (Oct1=Thursday, firstFriday=2, 5 rows, Nov1 spillover in row5 Domingo) matches reference image pixel-for-pixel in structure. Flagged one real risk: canvas may taint/throw on file:// protocol for local images - must test over a local static server."
      evidence:
        - "docs/goals/calendar-generator/goal.md (full charter, catalog list, constraints)"
        - "docs/goals/calendar-generator/notes/reference-calendar-layout.png (visual structure confirmed: title+flag, VIERNES/SABADO/DOMINGO columns, 5 rows, Nov1 spillover in last Domingo cell, blank Sabado filler cells)"
        - "docs/goals/calendar-generator/state.yaml (T002-T999 task shapes already drafted)"
        - "repo listing: only docs/goals/... and .gitignore exist; no apps/, no package.json, no node_modules"
      facts:
        - "Repo root currently contains only .git, .gitignore, and docs/goals/calendar-generator/* - zero conflicting conventions."
        - "Jan 1 2026 = Thursday; Oct 1 2026 = Thursday (273 days later, 273 mod 7 = 0)."
        - "Algorithm: dayOfWeek(Oct1)=Thu(4 if Sun=0); firstFriday = 1 + ((5 - dayOfWeek1 + 7) % 7) = 2. rows = ceil((daysInMonth - firstFriday + 1)/7) = ceil(30/7) = 5."
        - "For row i (0-indexed): Friday = Date(year, month, firstFriday + 7*i); Saturday = Friday+1 day; Sunday = Friday+2 days, using native Date arithmetic so month rollover is automatic (no manual overflow logic needed)."
        - "Traced Oct 2026: row0 Fri2/Sat3/Sun4, row1 Fri9/Sat10/Sun11, row2 Fri16/Sat17/Sun18, row3 Fri23/Sat24/Sun25, row4 Fri30/Sat31/Sun=Date(2026,9,32)=Nov1 2026 (spillover) - exactly matches reference image and goal.md's required date set (2,4,9,11,16,18,23,24,25,30 + Nov1)."
        - "Spillover only ever occurs forward (into next month) in the Domingo column because rows start at the first in-month Friday; there is no backward/leading-week spillover in this layout."
        - "Recommend Canvas API over SVG: canvas gives drawImage for raster format-art compositing plus single-call toDataURL()/toBlob() PNG export; SVG would need an extra SVG-to-canvas rasterization step to produce a downloadable PNG, adding indirection with no benefit since no backend/build step is used either way."
        - "Risk: if index.html is opened via file:// instead of http(s)://, canvas.toDataURL/toBlob can throw a security error for locally-loaded images in some browsers; Worker/Judge should plan to serve the app via a simple local static server (e.g. python3 -m http.server or npx serve) when testing export."
        - "No build step needed: plain HTML/CSS/JS (or ES modules via <script type=module>) is sufficient; the date-grid unit test can run via Node's built-in node --test + assert, requiring zero devDependencies."
        - "Catalog order/names in state.yaml T003 (Moderno, Pauper, Duel, EDH Fun, Store Championship, Taller Novatos, Commander Party, Proximamente, Standard, Legacy, Draft, Sealed) match goal.md's 12-entry list exactly - no contradiction found."
        - "Candidate split for T002/T003: keep grid-math (pure function monthGrid(year, monthIndexZeroBased) -> 5 rows x {date, column, inTargetMonth}) isolated in its own small reviewed/tested module since it's the highest-risk logic, per goal.md's own suggested exception to 'one big slice'; everything else (catalog, UI, canvas render, export) can remain one Worker slice."
      contradictions: []
      ambiguity_requiring_judge:
        - "Whether to isolate grid-math into its own earlier mini-task (per goal.md's explicit allowance) vs. bundling into the single T003 vertical slice as currently drafted."
        - "Exact bold/outlined font treatment seen in reference (thick white text, black stroke) - achievable with strokeText+fillText and a system bold font, but Judge should decide whether a custom web font is worth adding or a generic bold font is acceptable for this tranche."
      commands:
        - "ls -la"
        - "find docs/goals -type f"
        - "find . -not -path './.git*' -type f | sort"
      note_needed: false
