    reasoning_hint: high
    objective: "Review Scout findings and decide the concrete architecture: monorepo layout (apps/calendar-generator/), tech stack, format/image asset convention (flat catalog of 12 entries + generic custom-event image), composition + export mechanism, and the exact week-grid algorithm. Produce the full first-slice Worker spec."
